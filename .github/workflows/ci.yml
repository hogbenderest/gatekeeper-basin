name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Track upstream drift: does the package still build and test against upstream main?
  schedule:
    - cron: "0 3 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pin is the compatibility contract: bd10b0e is the commit this package
        # is developed and tested against. The drift leg only installs, generates and
        # type-checks, so a broken upstream main is visible without masking the
        # pinned leg.
        include:
          - pin: bd10b0ece6842b8f486b3467eab6cc3b9c920920
            label: pinned
            full: true
          - pin: main
            label: upstream-main
            full: false
    name: verify (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Clone cloudflare-os
        run: |
          git clone https://github.com/cloudflare/cloudflare-os.git cloudflare-os
          git -C cloudflare-os fetch --depth 1 origin ${{ matrix.pin }}
          git -C cloudflare-os checkout ${{ matrix.pin }}
      - name: Install upstream workspace
        run: pnpm --dir cloudflare-os install
      - name: Install this workspace
        run: pnpm install
      - name: Build configurator frames (never cached; deploys must never replay a built artifact)
        run: pnpm exec vp run -F @gadgets/gatekeeper-basin --no-cache build:configurator
      - name: Assert configurator frames exist and are non-empty
        run: |
          shopt -s nullglob
          frames=(packages/gatekeeper-basin/src/generated/*-configurator-ui.txt)
          [ ${#frames[@]} -eq 3 ] || { echo "expected 3 configurator frames, found ${#frames[@]}"; exit 1; }
          for f in "${frames[@]}"; do test -s "$f" || { echo "missing or empty: $f"; exit 1; }; done
      - name: Generate wrangler.jsonc with the upstream generator
        run: node --experimental-strip-types scripts/generate-configs.mjs
      - name: Generate worker types against the real source
        run: bash scripts/generate-worker-types.sh
      - name: Type check
        run: pnpm types:check
      - name: Test
        if: matrix.full
        run: pnpm test:run
      - name: Deploy dry-run
        if: matrix.full
        run: cd packages/gatekeeper-basin && ../../node_modules/.bin/wrangler deploy --dry-run
